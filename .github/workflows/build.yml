name: Build Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: GitHub Pages
            ruby: '3.3.4'
            arguments: --safe
          - platform: Cloudflare Pages
            ruby: '3.4.4'
            arguments: ''
    env:
      JEKYLL_ENV: production
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build with locked dependencies
        run: bash scripts/build.sh ${{ matrix.arguments }}
