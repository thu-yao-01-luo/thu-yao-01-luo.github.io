<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title | escape }} · {{ site.name }}{% endif %}</title>
    <meta name="description" content="{{ page.summary | default: page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.summary | default: page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile-home.webp' | absolute_url }}">
    <meta property="og:image:alt" content="Kairong Luo">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <script src="{{ '/assets/js/academic.js' | relative_url }}"></script>
  </head>
  <body class="academic-site">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">Kairong Luo<span lang="zh-Hans"> / 罗开荣</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" hidden><span aria-hidden="true">◐</span></button>
      </nav>
    </header>
    <main id="main" class="wrap{% if page.collection == 'publications' %} publication-page{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer wrap">
      <span>© {{ site.time | date: '%Y' }} Kairong Luo</span>
      <span>Updated {{ site.data.cv.lastUpdated | date: '%B %Y' }}</span>
    </footer>
  </body>
</html>
